; ==============================================================================
; SuperStation One / MiSTer FPGA Master Configuration
; ==============================================================================
[MiSTer]

; --- Console Mode Front-End Launcher ---
main=ConsoleMode/MiSTer_ConsoleMode

; --- Video Settings for Console Mode & 4K Displays ---
; 0 = 1280x720@60 (Native 1:1 pixel-perfect match for Console Mode UI & 3x integer to 4K)
video_mode=0

; V-Sync mode: 0 - 60Hz buffered (smooth UI rendering on all modern HDMI TVs)
vsync_adjust=0

; HDMI Color Range: 0 - Full range RGB (0..255). Eliminates washed out / milky blacks!
hdmi_limited=0

; Aspect ratio / scaling
vscale_mode=0
forced_scandoubler=0

; --- Audio Settings ---
; Audio volume and downmixing are managed within individual core OSD menus

; Controller & OSD Settings
controller_info=6
vga_scaler=0
key_menu_as_rgui=0
video_info=5

; ==============================================================================
; Sony PlayStation (PSX) Profile
; ==============================================================================
[PSX]
; Integer scale for razor-sharp square pixels
vscale_mode=1

; Clean sharp interpolation filter
vfilter_default=Interpolation (Sharp).txt
