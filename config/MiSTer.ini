; ==============================================================================
; SuperStation One / MiSTer FPGA Master Configuration Template
; ==============================================================================
[MiSTer]

; --- Video Settings ---
; 0 = 1280x720@60, 6 = 1920x1080@60, 8 = 1920x1080@50, 10 = 1920x1440@60, 12 = 2560x1440@60
video_mode=6

; V-Sync mode: 0 - 60Hz buffered, 1 - low lag (match core freq), 2 - zero lag (direct frame sync)
vsync_adjust=2

; Direct Video (for analog CRT output via HDMI-to-VGA/component transcoders)
; Set to 1 if using an analog CRT monitor/TV via the SuperStation One's analog output
direct_video=0

; Aspect ratio / scaling
; 0 - normal, 1 - integer scale only, 2 - scale to max height maintaining aspect ratio
vscale_mode=0

; Custom aspect ratio: 0 - native, 1 - 4:3, 2 - 16:9
forced_scandoubler=0

; --- Audio Settings ---
; Volume control: 0 - 100% volume
volumectl=0

; Enable stereo audio downmix to mono (0 - disabled, 1 - enabled)
stereo_mix=0

; --- SuperStation One / PSX Specifics ---
; Boot into PSX core automatically on startup if desired (uncomment to enable)
; bootcore=PSX

; Controller & OSD Settings
controller_info=6
vga_scaler=0
key_menu_as_rgui=0
video_info=5

; ==============================================================================
; Sony PlayStation (PSX) - Enhanced 4K TV Profile
; ==============================================================================
[PSX]
; 1 = Integer scaling (razor-sharp square pixels, zero scrolling distortion)
vscale_mode=1

; Sharp interpolation filter (replaces default blurry bilinear scaling)
vfilter_default=Interpolation (Sharp).txt

; Authentic CRT Trinitron aperture grille (natural scanline & phosphor blending)
shmask_default=Sony Trinitron (1968).txt
shmask_mode_default=1
